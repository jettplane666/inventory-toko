<!DOCTYPE html>

<label>Email<input id="em" value="owner@tokoku.demo"></label>
<label>Password<span class="pw"><input id="pw" type="password" value="Owner123!"><button type="button" onclick="pw.type=pw.type=='password'?'text':'password'">👁</button></span></label>
<label class="chk"><input type="checkbox" id="rm" checked> Ingat saya</label>
<button class="btn">Masuk</button><div id="lerr" class="err"></div>
<small class="mut">Demo: owner@tokoku.demo / Owner123! · kasir@tokoku.demo / Kasir123!<br>⚠ Login ini hanya simulasi frontend, tidak aman untuk produksi.</small></form></section>
<div id="app" hidden><aside id="side"><div class="brand"><svg class="lg s" viewBox="0 0 32 32" aria-label="TokoKu"><rect width="32" height="32" rx="9" fill="#2563eb"/><path d="M9 12h14l-1.2 11H10.2z" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round"/><path d="M12.5 12a3.5 3.5 0 0 1 7 0" fill="none" stroke="#fff" stroke-width="2"/><circle cx="16" cy="18" r="1.7" fill="#7dd3fc"/></svg><b id="brand"></b></div><nav id="nav"></nav>

<main id="main"></main></div></div>
